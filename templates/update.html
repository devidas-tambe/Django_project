<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</head>
<body>
    {% include 'nav.html' %}

    <h1>update</h1>

<form action="updateprofile" method="post">
    {% csrf_token %}
    {% for i in data %}
    <input type="hidden" name="id" value="{{ i.id }}">

    <label for="Fullname">Full Name:</label>
    <input type="text"  name="Fullname" value="{{ i.Fullname }}" placeholder="Enter your full Name"><br><br>

    <label for="Email">Email:</label>
    <input type="text" name="email" value="{{ i.email }}" placeholder="Enter your email" ><br><br>

    <label for="contact">Contact:</label>
    <input type="text" name="contact" value="{{ i.contact }}" placeholder="Enter your contact number"><br><br>

    <label for="password">Password:</label>
    <input type="text" name="password" value="{{ i.password }}" placeholder="Enter your password" ><br><br>
    {% endfor %}
    <button type="submit">update</button>

</form>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

<body>
    {% include 'nav.html' %}

    <h1>Register</h1>

<form action="saveform" method="post">
    {% csrf_token %}

    <label for="Fullname">Full Name:</label>
    <input type="text"  name="Fullname" placeholder="Enter your full name"><br><br>

    <label for="Email">Email:</label>
    <input type="text" name="email" placeholder="Enter your email" ><br><br>

    <label for="contact">Contact:</label>
    <input type="text" name="contact" placeholder="Enter your contact number"><br><br>

    <label for="password">Password:</label>
    <input type="text" name="password" placeholder="Enter your password" ><br><br>

    <button type="submit">Register</button>

</form>

</body>
